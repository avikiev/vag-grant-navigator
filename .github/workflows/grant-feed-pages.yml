name: Publish UTGA Grant Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/grants.json"
      - "data/catalogue-meta.json"
      - "scripts/publish-feed.mjs"
      - ".github/workflows/grant-feed-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grant-feed-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build public JSON feed
        run: node scripts/publish-feed.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload feed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy feed
        id: deployment
        uses: actions/deploy-pages@v4
